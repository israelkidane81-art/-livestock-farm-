

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livestock Farming</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f3;
      color: #244c35;
    }
    header {
      background: #075b3a;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .banner {
      background: #dcebdc;
      text-align: center;
      padding: 35px 10px;
    }
    .animals {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 15px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 18px 8px;
      text-align: center;
      box-shadow: 0 3px 10px #00000010;
    }
    .animal {
      font-size: 45px;
    }
    .price {
      color: #087846;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h2>🌿 Livestock Farming</h2>
  </header>
  <section class="banner">
    <h1>Welcome to Our Farm</h1>
    <p>Healthy Animals, Better Farming</p>
  </section>
  <section class="animals">
    <div class="card">
      <div class="animal">🐔</div>
      <h3>Chicken</h3>
      <p class="price">ETB 1,200</p>
    </div>
    <div class="card">
      <div class="animal">🐐</div>
      <h3>Goat</h3>
      <p class="price">ETB 2,800</p>
    </div>
    <div class="card">
      <div class="animal">🐑</div>
      <h3>Sheep</h3>
      <p class="price">ETB 5,050</p>
    </div>
    <div class="card">
      <div class="animal">🐄</div>
      <h3>Cow</h3>
      <p class="price">ETB 10,100</p>
    </div>
  </section>
</body>
</html>
